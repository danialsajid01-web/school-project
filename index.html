<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City College Minchinabad (CHSS) - ERP & Faculty Portal</title>
    
    <script>
        const API_URL = 'https://school-project-production-3962.up.railway.app';
    </script>

    <style>
        :root {
            --primary: #0077b6;
            --secondary: #0096c7;
            --accent: #ffb703;
            --success: #008037;
            --danger: #d90429;
            --warning: #f59e0b;
            --bg-dark: #0a192f;
            --bg-light: #f0f8ff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            margin: 0;
            padding: 0;
            color: #333;
            transition: background 0.8s ease;
            overflow-x: hidden;
        }

        body.light-on { background-color: var(--bg-light); }

        #toast-container {
            position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;
        }

        .toast {
            background: rgba(10, 25, 47, 0.95); backdrop-filter: blur(12px); color: white; padding: 12px 20px;
            border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border-left: 4px solid var(--accent);
            font-size: 13px; font-weight: 500; animation: slideInRight 0.4s ease, fadeOut 0.4s ease 2.6s forwards;
            display: flex; align-items: center; gap: 10px;
        }

        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(10px); } }

        #login-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; position: relative;
        }

        .college-logo-preview {
            width: 140px; height: 140px; border-radius: 50%; border: 4px solid var(--accent);
            box-shadow: 0 0 30px rgba(255, 183, 3, 0.6); margin-bottom: 12px; background: white;
            display: flex; align-items: center; justify-content: center; animation: floatLogo 3s ease-in-out infinite;
        }

        @keyframes floatLogo { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.03); } }

        .lamp-container { position: relative; margin-bottom: 20px; cursor: pointer; animation: floatLogo 3s ease-in-out infinite; }
        .lamp-wire { width: 4px; height: 40px; background: #475569; margin: 0 auto; }
        .lamp-head { width: 80px; height: 45px; background: #1e293b; border-radius: 0 0 40px 40px; margin: 0 auto; position: relative; transition: background 0.4s; }
        body.light-on .lamp-head { background: var(--accent); box-shadow: 0 0 35px var(--accent), 0 0 70px rgba(255, 183, 3, 0.6); }

        .light-beam {
            position: absolute; top: 240px; left: 50%; transform: translateX(-50%); width: 0px; height: 0px;
            border-left: 90px solid transparent; border-right: 90px solid transparent; border-top: 0px solid rgba(255, 183, 3, 0);
            transition: all 0.6s ease; pointer-events: none;
        }
        body.light-on .light-beam { border-top: 220px solid rgba(255, 183, 3, 0.15); filter: blur(10px); }

        .login-card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(14px); padding: 30px; border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1); width: 340px; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        body.light-on .login-card { background: #ffffff; border: 1px solid #cbd5e1; box-shadow: 0 15px 30px rgba(0,0,0,0.08); }

        .login-card h2 { color: white; margin-top: 0; font-size: 20px; font-weight: 700; margin-bottom: 5px; }
        body.light-on .login-card h2 { color: var(--primary); }
        .login-card p.sub-title { color: var(--accent); font-size: 13px; font-weight: 600; margin: 0 0 15px 0; }

        .login-input, .login-select {
            width: 100%; padding: 11px; margin-bottom: 15px; border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px; background: rgba(0, 0, 0, 0.2); color: white; box-sizing: border-box; outline: none;
        }
        body.light-on .login-input, body.light-on .login-select { background: #f8fafc; border: 1px solid #cbd5e0; color: #333; }

        .login-btn {
            width: 100%; background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 119, 182, 0.3); transition: transform 0.2s;
        }

        #dashboard-screen { display: none; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        header {
            background: linear-gradient(135deg, #005f73, #0a9396, var(--primary)); color: white; padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 6px 25px rgba(0,0,0,0.25);
            border-bottom: 5px solid var(--accent);
        }
        .header-left { display: flex; align-items: center; gap: 24px; }
        .header-logo {
            width: 90px; height: 90px; border-radius: 50%; border: 4px solid var(--accent);
            box-shadow: 0 0 25px rgba(255, 183, 3, 0.7); background: white; display: flex; align-items: center; justify-content: center;
        }
        header h1 { margin: 0; font-size: 28px; font-weight: 800; text-transform: uppercase; }
        header p { margin: 6px 0 0; font-size: 14px; color: var(--accent); font-weight: 700; }

        .logout-btn {
            background: linear-gradient(135deg, #d90429, #ef233c); color: white; border: none; padding: 10px 22px;
            border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px; box-shadow: 0 4px 15px rgba(217, 4, 41, 0.4);
        }

        .navbar {
            background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(16px); display: flex; justify-content: space-between;
            align-items: center; padding: 14px 35px; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid rgba(255, 183, 3, 0.3);
        }
        .nav-links { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .nav-btn {
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); padding: 9px 14px;
            font-size: 12px; font-weight: 600; color: #cbd5e1; cursor: pointer; border-radius: 8px; transition: all 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .nav-btn:hover { color: #ffffff; background: rgba(0, 119, 182, 0.25); border-color: rgba(0, 119, 182, 0.5); }
        .nav-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #ffffff; border-color: var(--accent);
            box-shadow: 0 6px 20px rgba(0, 119, 182, 0.5); font-weight: 700;
        }
        .role-badge { font-weight: 800; color: var(--accent); font-size: 12px; letter-spacing: 1px; padding: 7px 14px; background: rgba(255, 183, 3, 0.1); border-radius: 6px; border: 1px solid rgba(255, 183, 3, 0.3); text-transform: uppercase; }

        .container { max-width: 1200px; margin: 25px auto; padding: 0 20px; }
        .tab-section { display: none; }
        .tab-section.active { display: block; animation: fadeInTab 0.2s ease; }
        @keyframes fadeInTab { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 22px; border: 1px solid #e2e8f0; }
        
        .card h3 { 
            margin-top: 0; color: var(--primary); border-bottom: 2px solid #edf2f7; padding-bottom: 12px; font-size: 16px; 
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 12px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: 600; font-size: 12px; color: #4a5568; }
        input, select, textarea { padding: 9px 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 13px; outline: none; }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0, 119, 182, 0.1); }

        .search-box {
            padding: 7px 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 12px; width: 160px; outline: none; background: #fff;
        }

        button.submit-btn { background: var(--success); color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 6px; font-size: 13px; font-weight: 600; }
        button.submit-btn:hover { opacity: 0.9; }

        .btn-action { padding: 5px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; font-weight: 600; border: none; margin-right: 4px; }
        .btn-edit { background: var(--warning); color: white; }
        .btn-delete { background: var(--danger); color: white; }
        .btn-excel { background: var(--success); color: white; padding: 6px 12px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }

        table { width: 100%; margin-top: 12px; border-collapse: collapse; border-radius: 6px; overflow: hidden; }
        th, td { border: 1px solid #e2e8f0; padding: 10px 14px; text-align: left; font-size: 13px; }
        th { background-color: #f1f5f9; color: var(--primary); font-weight: 600; }
        tr:nth-child(even) { background-color: #f8fafc; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <!-- ================= LOGIN SCREEN ================= -->
    <div id="login-screen">
        <div class="light-beam"></div>
        <div class="college-logo-preview">
            <svg width="120" height="120" viewBox="0 0 200 200">
                <circle cx="100" cy="100" r="95" fill="#0099ff" stroke="#ffb703" stroke-width="5"/>
                <text x="100" y="50" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">CITY</text>
                <text x="100" y="70" fill="#ffb703" font-size="13" font-weight="bold" text-anchor="middle">MINCHINABAD</text>
                <circle cx="100" cy="85" r="16" fill="#ffb703"/>
                <text x="100" y="155" fill="#000000" font-size="22" font-weight="bold" text-anchor="middle" font-family="serif">CHSS</text>
            </svg>
        </div>
        
        <div class="lamp-container" onclick="toggleLight()" title="Click lamp to turn light on/off">
            <div class="lamp-wire"></div>
            <div class="lamp-head"></div>
        </div>

        <div class="login-card">
            <h2>City College Minchinabad</h2>
            <p class="sub-title">Select Portal Role & Login</p>
            <select id="login_role" class="login-select">
                <option value="admin">Admin Portal</option>
                <option value="principal">Principal Portal</option>
                <option value="teacher">Teacher Portal</option>
            </select>
            <input type="text" id="username" class="login-input" placeholder="Username (e.g. admin)">
            <input type="password" id="password" class="login-input" placeholder="Password">
            <button class="login-btn" onclick="attemptLogin()">Turn On Light & Login</button>
        </div>
    </div>

    <!-- ================= DASHBOARD SCREEN ================= -->
    <div id="dashboard-screen">
        <header>
            <div class="header-left">
                <div class="header-logo">
                    <svg width="75" height="75" viewBox="0 0 200 200">
                        <circle cx="100" cy="100" r="95" fill="#0099ff" stroke="#ffb703" stroke-width="6"/>
                        <text x="100" y="55" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">CITY</text>
                        <text x="100" y="150" fill="#000000" font-size="24" font-weight="bold" text-anchor="middle" font-family="serif">CHSS</text>
                    </svg>
                </div>
                <div>
                    <h1>City College Minchinabad (CHSS)</h1>
                    <p>🎓 Faculty & Admin Management System</p>
                </div>
            </div>
            <div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>

        <div class="navbar">
            <div class="nav-links" id="navbarLinks">
                <button class="nav-btn active" onclick="switchTab('students')">Students</button>
                <button class="nav-btn" onclick="switchTab('teachers')">Teachers</button>
            </div>
            <div class="role-badge" id="roleDisplayBadge">ADMIN</div>
        </div>

        <div class="container">
            <div id="students" class="tab-section active">
                <div class="card">
                    <h3>Enrolled Students Directory</h3>
                    <p>Welcome to dashboard portal!</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function toggleLight() {
            document.body.classList.toggle('light-on');
        }

        function attemptLogin() {
            const role = document.getElementById('login_role').value;
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (!document.body.classList.contains('light-on')) {
                document.body.classList.add('light-on');
            }

            if (!user || !pass) {
                showToast('❌ Please enter Username & Password');
                return;
            }

            // Client side basic login validation logic
            showToast('✅ Login Successful!');
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard-screen').style.display = 'block';
            document.getElementById('roleDisplayBadge').innerText = role.toUpperCase();
        }

        function logout() {
            document.getElementById('dashboard-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            showToast('Logged out successfully');
        }

        function switchTab(tabId) {
            const tabs = document.querySelectorAll('.tab-section');
            tabs.forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }
    </script>
</body>
</html>
